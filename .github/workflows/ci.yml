name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Servidor
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
          - { name: Linux, os: ubuntu-24.04 }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake pkg-config libclang-dev libxcb1-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - name: libclang en Windows
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

      - name: Formato de Rust
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy, con advertencias como errores
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Pruebas de Rust
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo test --no-fail-fast > test.log 2>&1
          code=$?
          tail -60 test.log
          # Los fallos se publican como anotaciones, legibles sin iniciar sesión.
          if [ $code -ne 0 ]; then
            # GitHub limita las anotaciones por paso: todo va en una sola, con saltos %0A.
            summary=$(grep -E "^(error|test .*FAILED)|panicked at|undefined (reference|symbol)|cannot find -l|rust-lld: |/ld: |^ *--> |left:|right:" test.log | head -60 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$summary"
          fi
          exit $code

      - name: Compilar instaladores
        run: npx tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: nexium-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
