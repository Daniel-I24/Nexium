name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  server:
    name: Servidor
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Holgado frente a lo normal (Windows unos 20 min, macOS 10, Linux 12), pero corta un job colgado.
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, timeout: 90 }
          - { name: macOS, os: macos-latest, timeout: 60 }
          - { name: Linux, os: ubuntu-24.04, timeout: 45 }
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        # Suele tardar menos de un minuto. Dos veces se colgó más de 2 horas en apt.
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake pkg-config libclang-dev libxcb1-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - name: libclang en Windows
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Cargo no recompila whisper.cpp al cambiar las variables GGML_ de .cargo/config.toml: una caché
          # anterior lo dejaría compilado para el procesador del servidor. Cambiar esta clave la descarta.
          key: ggml-x86-64-avx2

      - run: npm ci
      - run: npm run lint
      - run: npm test

      # Diseño en navegador real: Edge en Windows (el motor de WebView2) y Chromium en Linux.
      - name: Chromium para las pruebas de diseño
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: npx playwright install --with-deps chromium
      - name: Pruebas de diseño
        if: runner.os != 'macOS'
        timeout-minutes: 20
        env:
          NEXIUM_PW_CHANNEL: ${{ runner.os == 'Linux' && 'chromium' || 'msedge' }}
        run: npm run test:layout

      - run: npm run build

      - name: Formato de Rust
        working-directory: src-tauri
        run: cargo fmt --all --check

      - name: Clippy, con advertencias como errores
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Pruebas de Rust
        working-directory: src-tauri
        shell: bash
        run: |
          set +e
          CARGO_TERM_COLOR=never cargo test --no-fail-fast > test.log 2>&1
          code=$?
          tail -60 test.log
          # Los fallos se publican como anotaciones, legibles sin iniciar sesión.
          if [ $code -ne 0 ]; then
            # GitHub limita las anotaciones por paso: todo va en una sola, con saltos %0A.
            summary=$(grep -E "^(error|test .*FAILED)|panicked at|undefined (reference|symbol)|cannot find -l|rust-lld: |/ld: |^ *--> |left:|right:" test.log | head -60 | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error::$summary"
          fi
          exit $code

      - name: Compilar instaladores
        run: npx tauri build

      # Regresión: en distribución, whisper.cpp llegó a compilarse sin optimizar (13 s por orden en lugar de 1 s).
      # force-debug es lo que lo deja optimizado (Cargo.toml). La medición se verifica a mano: docs/RENDIMIENTO.md.
      - name: whisper.cpp se compila optimizado
        working-directory: src-tauri
        shell: bash
        run: cargo tree -p whisper-rs-sys -e features -f "{p} [{f}]" --depth 0 | grep -F "[force-debug]"

      # Regresión: la 1.0.0 se cerraba al pulsar Hablar en procesadores sin AVX-512 (whisper.cpp compilado con
      # GGML_NATIVE en el servidor de la CI). Falla si ggml-cpu contiene instrucciones AVX-512.
      - name: whisper.cpp sin instrucciones del procesador del servidor
        working-directory: src-tauri
        shell: bash
        run: ../scripts/check-cpu-baseline.sh

      - uses: actions/upload-artifact@v4
        with:
          name: nexium-${{ runner.os }}
          retention-days: 14
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
