name: Publicación

# Al subir una etiqueta v1.2.3: compila los instaladores firmados de los tres sistemas y los publica en una
# Release de GitHub, con el latest.json que consulta el actualizador.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publicar:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest, target: "" }
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin }
          - { name: macOS Intel, os: macos-15-intel, target: x86_64-apple-darwin }
          - { name: Linux, os: ubuntu-24.04, target: "" }
    env:
      # La dirección del servidor de IA no es secreta: se fija al compilar.
      NEXIUM_AI_SERVER_URL: https://nexium-ai.nexium-ai.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake pkg-config libclang-dev libxcb1-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - name: libclang en Windows
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Nexium ${{ github.ref_name }}
          releaseBody: |
            Instaladores de Nexium para Windows, macOS y Linux. Las instrucciones de instalación, los avisos de
            SmartScreen y Gatekeeper y la privacidad están en el README del repositorio.
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
