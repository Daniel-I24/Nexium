name: Publicación

# Al subir una etiqueta v1.2.3:
# 1. se crea un borrador de Release;
# 2. cada sistema compila sus instaladores firmados, los sube al borrador (con el latest.json del actualizador) y
#    comprueba que whisper.cpp no lleva instrucciones del procesador del servidor;
# 3. solo si los cuatro terminan bien, se comprueban los archivos y se publica con las notas en español de
#    .github/release-notes.md y .github/changes/<versión>.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  borrador:
    name: Borrador de la Release
    runs-on: ubuntu-24.04
    outputs:
      id: ${{ steps.crear.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Novedades de la versión
        run: |
          version="${GITHUB_REF_NAME#v}"
          test -f ".github/changes/${version}.md" || { echo "::error::Falta .github/changes/${version}.md con las novedades."; exit 1; }
      - id: crear
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "Nexium $GITHUB_REF_NAME" \
            --notes "Borrador en preparación: las notas se añaden al publicarla."
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$GITHUB_REF_NAME\" and .draft) | .id" | head -1)
          test -n "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

  publicar:
    name: ${{ matrix.name }}
    needs: borrador
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          # «app» en macOS: el actualizador usa su .app.tar.gz; para instalar se descarga el .dmg.
          - { name: Windows, os: windows-latest, target: "", bundles: "nsis" }
          - { name: macOS Apple Silicon, os: macos-latest, target: aarch64-apple-darwin, bundles: "app,dmg" }
          - { name: macOS Intel, os: macos-15-intel, target: x86_64-apple-darwin, bundles: "app,dmg" }
          - { name: Linux, os: ubuntu-24.04, target: "", bundles: "deb,appimage" }
    env:
      # La dirección del servidor de IA no es secreta: se fija al compilar.
      NEXIUM_AI_SERVER_URL: https://nexium-ai.nexium-ai.workers.dev
    steps:
      - uses: actions/checkout@v4

      - name: Dependencias de Linux
        if: runner.os == 'Linux'
        timeout-minutes: 10
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev libasound2-dev cmake pkg-config libclang-dev libxcb1-dev \
            libxrandr-dev libdbus-1-dev libpipewire-0.3-dev libwayland-dev libegl-dev libgbm-dev

      - name: libclang en Windows
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.borrador.outputs.id }}
          includeUpdaterJson: true
          args: --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundles }} ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

      # Regresión de la 1.0.0: whisper.cpp con instrucciones del procesador del servidor (AVX-512).
      - name: whisper.cpp sin instrucciones del procesador del servidor
        working-directory: src-tauri
        shell: bash
        run: ../scripts/check-cpu-baseline.sh ${{ matrix.target && format('--target {0}', matrix.target) || '' }}

  publicar-notas:
    name: Notas y publicación
    needs: publicar
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Comprobar los archivos y publicar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          node scripts/release-notes.mjs "$version" > notas.md
          assets=$(gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name')
          echo "$assets"
          for expected in "Nexium_${version}_x64-setup.exe" "Nexium_${version}_x64-setup.exe.sig" \
            "Nexium_${version}_aarch64.dmg" "Nexium_${version}_x64.dmg" \
            "Nexium_${version}_amd64.deb" "Nexium_${version}_amd64.AppImage" latest.json; do
            echo "$assets" | grep -qxF "$expected" || { echo "::error::Falta $expected en la Release."; exit 1; }
          done
          if echo "$assets" | grep -qE '[.]msi'; then echo "::error::La Release no debe incluir el .msi."; exit 1; fi
          gh release edit "$GITHUB_REF_NAME" --notes-file notas.md --draft=false --latest
