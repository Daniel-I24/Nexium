[package]
name = "nexium"
version = "0.1.0"
description = "Asistente inteligente de escritorio multiplataforma"
edition = "2021"
rust-version = "1.90"

[lib]
name = "nexium_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2.8"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs", "io-util"] }
tokio-util = "0.7"
futures-util = "0.3"
async-trait = "0.1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "query"] }
rusqlite = { version = "0.41", features = ["bundled"] }
sysinfo = "0.40"
starship-battery = "0.12"
xcap = "0.9"
cpal = "0.18"
# Versión exacta: ver `watch_cancellation` en src/providers/speech.rs antes de actualizarla.
whisper-rs = "=0.16.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
sha2 = "0.10"
walkdir = "2"
regex = "1"
unicode-normalization = "0.1"
dotenvy = "0.15"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-opener = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_NetworkManagement_WiFi"] }

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.14", default-features = false, features = ["tokio", "screenshot"] }
url = "2"

[dev-dependencies]
tempfile = "3"
wiremock = "0.6"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
# whisper.cpp es inutilizable sin optimizar; se compila optimizado incluso en desarrollo.
[profile.dev.package.whisper-rs-sys]
opt-level = 3
[profile.release.package.whisper-rs-sys]
opt-level = 3
